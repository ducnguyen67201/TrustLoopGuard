            $ref: '#/components/schemas/PolicySummary'
    HardenCandidate:
      type: object
      description: One recommended guardrail synthesized + verified from a job's landed attacks.
      required:
      - policy
      - operation
      - substrate
      - evidence_seqs
      - source
      - verify
      properties:
        evidence_seqs:
          type: array
          items:
            type: integer
            format: int32
          description: '`seq` of the landed cases this candidate was derived from.'
        existing_policy_id:
          type:
          - string
          - 'null'
          description: Existing policy id when `operation = tighten`.
        operation:
          $ref: '#/components/schemas/HardenCandidateOperation'
          description: |-
            Whether this recommendation creates a new policy or tightens an existing
            stable harden policy id.
        policy:
          $ref: '#/components/schemas/PolicyDocument'
          description: The synthesized policy (persisted `enabled = false` when `persist`).
        source:
          type: string
          description: 'Where the match logic came from: `llm` | `deterministic`.'
        substrate:
          type: string
          description: |-
            Enforcement substrate, e.g. `semantic_output` | `regex_output` |
            `approval` | `param_source`.
        verify:
          $ref: '#/components/schemas/VerifyResult'
    HardenCandidateOperation:
      type: string
      description: |-
        Whether a harden candidate creates a new guardrail or updates the stable
        guardrail previously synthesized for the same agent + harm class.
      enum:
      - create
      - tighten
    HardenRejection:
      type: object
      description: One harden attempt that did not pass verify-before-recommend.
      required:
      - reason
      - substrate
      - evidence_seqs
      - message
      properties:
        evidence_seqs:
          type: array
          items:
            type: integer
            format: int32
        message:
          type: string
        reason:
          $ref: '#/components/schemas/HardenRejectionReason'
        substrate:
          type: string
        verify:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VerifyResult'
    HardenRejectionReason:
      type: string
      description: Why a synthesized harden candidate was not recommended.
      enum:
      - no_target_reply
      - synthesis_invalid
      - missed_landed
      - missed_variant
      - false_blocked_control
      - semantic_judge_unavailable
      - unreachable_substrate
    HardenRequest:
      type: object
      description: Body of `POST /v1/redteam/jobs/{id}/harden`.
      properties:
        persist:
          type: boolean
          description: |-
            `false` (default) previews candidates without persisting; `true` upserts
            the survivors `enabled = false`.
    HardenResponse:
      type: object
      description: Response from `POST /v1/redteam/jobs/{id}/harden`.
      required:
      - candidates
      - rejections
      - unreachable
      - generated_at
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/HardenCandidate'
        generated_at:
          type: string
          description: RFC 3339 timestamp of when these candidates were generated.
        rejections:
          type: array
          items:
            $ref: '#/components/schemas/HardenRejection'
          description: Candidate attempts that were intentionally not recommended.
        unreachable:
          type: array
          items:
            type: string
          description: |-
            Substrates a landed attack needed but that this job's traces could not
            reach (e.g. an action attack with only output-level traces). Surfaced
            so coverage gaps are explicit rather than silently approximated.
