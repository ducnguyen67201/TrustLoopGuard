        model:
          type: string
          description: Normalized model key (trimmed, lowercase).
        output_per_million_minor:
          type: integer
          format: int64
          description: USD minor units per 1M completion tokens.
        source:
          $ref: '#/components/schemas/LlmPriceSource'
    LlmPriceSource:
      type: string
      description: |-
        Where an effective model price comes from: a workspace-edited row or
        the built-in default table.
      enum:
