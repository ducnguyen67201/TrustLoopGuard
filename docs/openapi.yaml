      type: object
      required:
      - prices
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/LlmModelPrice'
    LlmUsageBucket:
      type: object
      description: |-
        One `group_by` rollup row. `key` is always a string: an RFC 3339
        date (`YYYY-MM-DD`) for day buckets, otherwise the principal or
        model value.
      required:
      - key
      - prompt_tokens
      - completion_tokens
      - cost_minor
      - calls
      properties:
        calls:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        cost_minor:
          type: integer
          format: int64
        key:
          type: string
        prompt_tokens:
          type: integer
          format: int64
        unpriced:
          type:
          - boolean
          - 'null'
          description: |-
            `true` when this model bucket includes token-bearing calls that
            were recorded with zero cost, so `cost_minor` undercounts the
            selected window. Only set on `group_by=model` buckets; omitted
            when every call in the bucket had a nonzero price.
    LlmUsageBucketsResponse:
      type: object
      required:
      - buckets
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/LlmUsageBucket'
    LlmUsageEvent:
      type: object
      description: One metered LLM gateway call.
      required:
      - id
      - workspace_id
      - principal_id
      - api_key_id
      - model
      - prompt_tokens
      - completion_tokens
      - cost_minor
      - currency
      - request_id
      - metadata
      - effective_at
      properties:
        api_key_id:
          type: string
        completion_tokens:
          type: integer
          format: int64
        cost_minor:
          type: integer
          format: int64
          description: |-
            Priced cost in currency minor units. `0` when the model has no
            price table entry.
        currency:
          type: string
        effective_at:
          type: string
          description: RFC 3339 timestamp.
        id:
          type: string
        metadata: {}
        model:
          type: string
          description: |-
            Raw model string from the provider response (deployment prefixes
            and all); pricing normalization never rewrites it.
        principal_id:
          type: string
          description: |-
            Principal the spend is attributed to. Keys without a bound
            principal fall back to the API key id.
        prompt_tokens:
          type: integer
          format: int64
        request_id:
          type: string
          description: |-
            Gateway request id — unique per workspace, makes retried
            metering writes idempotent.
        workspace_id:
          type: string
    LlmUsageListResponse:
      type: object
      required:
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/LlmUsageEvent'
    LlmUsageResponse:
      oneOf:
      - $ref: '#/components/schemas/LlmUsageListResponse'
      - $ref: '#/components/schemas/LlmUsageBucketsResponse'
      description: |-
        `GET /v1/llm-usage` 200 body: the raw event list, or grouped buckets
