    get:
      tags:
      - redteam
      summary: '`GET /v1/redteam/reports/{token}` — public, token-authenticated report.'
      description: |-
        Unauthenticated by design: the token is the bearer capability. The job
        lookup is scoped to the token's stored workspace, never the request, so a
        token cannot reach another workspace's data.
      operationId: get_public_report
      parameters:
      - name: token
        in: path
        description: Report share token
        required: true
        schema:
