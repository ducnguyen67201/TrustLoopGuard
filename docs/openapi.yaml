openapi: 3.0.3
info:
  title: TrustLoopGuard API
  description: Real-time guardrail runtime for AI agents.
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - guard
      operationId: health
      responses:
        '200':
          description: Liveness probe
          content:
            text/plain:
              schema:
                type: string
  /v1/agents:
    get:
      tags:
      - agents
      summary: '`GET /v1/agents`. Returns all registered profiles. Bypasses the'
      description: store's read cache because admin-list isn't on the hot path.
      operationId: list_agents
      responses:
        '200':
          description: All agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - agents
      summary: '`POST /v1/agents` — upsert a profile. Body is YAML (when'
      description: '`Content-Type` is `*yaml*`) or JSON.'
      operationId: upsert_agent
      requestBody:
        description: Agent profile, YAML or JSON
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/AgentProfile'
        required: true
      responses:
        '201':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Profile failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}:
    get:
      tags:
      - agents
      summary: '`GET /v1/agents/:id`.'
      operationId: get_agent
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - agents
      summary: '`DELETE /v1/agents/:id`. Soft-delete via the store.'
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Profile deleted
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/guardrails:
    get:
      tags:
      - agents
      summary: '`GET /v1/agents/{id}/guardrails` — list active policies owned by an'
      description: agent. Does not require the agent to exist; missing agent → empty list.
      operationId: list_guardrails
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policies owned by the agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/guardrails/generate:
    post:
      tags:
      - agents
      summary: '`POST /v1/agents/{id}/guardrails/generate` — derive a set of'
      description: |-
        guardrail policies tailored to an agent's stored `system_prompt`,
        auto-persist them with `enabled=false`, and return what was saved.

        Callers review the set and flip individual policies on via
        `PATCH /v1/policies/{id}/enabled`. Runtime checks never see these
        policies until that happens (because `/v1/check` filters by enabled).
      operationId: generate_guardrails
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Generated and persisted policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailGenerateResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Agent has no system_prompt to derive guardrails from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: LLM provider failed or returned invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: LLM is not configured on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/api-keys:
    get:
      tags:
      - api-keys
      summary: '`GET /v1/api-keys` - list workspace runtime API keys.'
      operationId: list_api_keys
      responses:
        '200':
          description: Workspace API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: '`POST /v1/auth/login` — verify credentials.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '200':
          description: Credentials accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/password:
    post:
      tags:
      - auth
      summary: '`POST /v1/auth/password` — change an existing user''s password.'
      description: |-
        The caller must demonstrate knowledge of the current password by
        including it in the request. We deliberately *don't* require a
        session/JWT here because tl-server doesn't issue per-user tokens
        yet; the current-password check covers the same ground.
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Current password did not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/signup:
    post:
      tags:
      - auth
      summary: '`POST /v1/auth/signup` — create a new account.'
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/check:
    post:
      tags:
      - guard
      operationId: check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
        required: true
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: API version no longer served
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Runtime policy resolution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/knowledge-sources:
    get:
      tags:
      - knowledge-sources
      summary: '`GET /v1/knowledge-sources` - list workspace knowledge sources.'
      operationId: list_knowledge_sources
      responses:
        '200':
          description: Knowledge sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - knowledge-sources
      summary: '`POST /v1/knowledge-sources` - create a workspace knowledge source.'
      operationId: create_knowledge_source
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeSourceRequest'
        required: true
      responses:
        '201':
          description: Knowledge source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceDocument'
        '400':
          description: Malformed or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/knowledge-sources/{id}/file:
    get:
      tags:
      - knowledge-sources
      summary: '`GET /v1/knowledge-sources/:id/file` - fetch stored file content.'
      operationId: get_knowledge_source_file
      parameters:
      - name: id
        in: path
        description: Knowledge source id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Knowledge source file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSourceFileResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Knowledge source file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies:
    get:
      tags:
      - policies
      summary: '`GET /v1/policies` — list active policy summaries.'
      operationId: list_policies
      responses:
        '200':
          description: All active policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - policies
      summary: '`POST /v1/policies` — create or update a policy from YAML or JSON.'
      operationId: upsert_policy
      requestBody:
        description: Policy document, YAML or JSON
        content:
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        '201':
          description: Policy created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Policy failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/draft:
    post:
      tags:
      - policies
      summary: '`POST /v1/policies/draft` — LLM-draft a policy skeleton from a natural-'
      description: |-
        language prompt. The server holds the provider key; callers see a
        strict, typed response. Returns 503 when no LLM is configured.
      operationId: draft_policy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyDraftRequest'
        required: true
      responses:
        '200':
          description: Drafted policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDraftResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: LLM provider failed or returned invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: LLM is not configured on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/validate:
    post:
      tags:
      - policies
      summary: '`POST /v1/policies/validate` — validate policy YAML or JSON without saving it.'
      operationId: validate_policy
      requestBody:
        description: Policy document, YAML or JSON
        content:
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidateResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/{id}:
    get:
      tags:
      - policies
      summary: '`GET /v1/policies/:id` — fetch a policy document.'
      operationId: get_policy
      parameters:
      - name: id
        in: path
        description: Policy identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - policies
      summary: '`DELETE /v1/policies/:id` — soft-delete a policy.'
      operationId: delete_policy
      parameters:
      - name: id
        in: path
        description: Policy identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Policy deleted
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/{id}/enabled:
    patch:
      tags:
      - policies
      summary: '`PATCH /v1/policies/:id/enabled` — enable or disable a policy.'
      operationId: set_policy_enabled
      parameters:
      - name: id
        in: path
        description: Policy identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySetEnabledRequest'
        required: true
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/settings:
    get:
      tags:
      - settings
      summary: '`GET /v1/settings` - read workspace runtime settings.'
      operationId: get_settings
      responses:
        '200':
          description: Workspace runtime settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettings'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/traces:
    get:
      tags:
      - traces
      summary: '`GET /v1/traces` - list recent persisted decision traces for a workspace.'
      operationId: list_traces
      parameters:
      - name: limit
        in: query
        description: Maximum traces to return, capped at 100
        required: false
        schema:
          type: integer
          nullable: true
          minimum: 0
      responses:
        '200':
          description: Recent traces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    AgentAuthority:
      type: object
      properties:
        can_promise:
          type: array
          items:
            type: string
        cannot_promise:
          type: array
          items:
            type: string
    AgentListResponse:
      type: object
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfile'
    AgentProfile:
      type: object
      description: |-
        What an agent is, what it may claim, and how it should sound.

        Authored as YAML by the customer (see `policies/agents/*.yaml`), parsed
        by `tl-policy::load_agent_str`, persisted in Postgres, cached in process,
        and consulted by Tier 2 (out-of-scope embedding lookup) and Tier 3
        (LLM judge ground truth).
      required:
      - agent_id
      - display_name
      - scope
      - authority
      - tone
      properties:
        agent_id:
          type: string
        authority:
          $ref: '#/components/schemas/AgentAuthority'
        display_name:
          type: string
        escalation_triggers:
          type: array
          items:
            type: string
        knowledge_sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
        scope:
          $ref: '#/components/schemas/AgentScope'
        system_prompt:
          type: string
          description: |-
            Raw system prompt the customer ships to their LLM. Source of truth
            for auto-generating guardrails: `POST /v1/agents/{id}/guardrails:generate`
            reads this and asks an LLM to derive a policy set tailored to it.
            Optional at the type level so existing profiles keep deserializing;
            the generate endpoint enforces presence at call time.
          nullable: true
        tone:
          $ref: '#/components/schemas/AgentTone'
    AgentScope:
      type: object
      properties:
        in_scope:
          type: array
          items:
            type: string
        out_of_scope:
          type: array
          items:
            type: string
    AgentTone:
      type: object
      required:
      - target
      properties:
        forbidden:
          type: array
          items:
            type: string
        target:
          type: string
    ApiError:
      type: object
      description: |-
        Canonical error envelope returned on non-2xx responses from every
        TrustLoopGuard endpoint. SDKs deserialize this body to produce typed
        errors; integrators don't have to inspect status codes by hand.

        The shape is intentionally minimal — `code` drives SDK-side fan-out,
        `message` is for logs, `retriable` tells callers whether the same
        request may be retried, and `details` is opaque so the server can
        add validation field paths without breaking SDKs.
      required:
      - code
      - message
      - retriable
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        details:
          description: |-
            Opaque structured details (e.g. validation field path).
            Defaults to `null`; servers may add fields without breaking SDKs.
        message:
          type: string
        retriable:
          type: boolean
          description: |-
            Whether the caller may retry the same request without modification.
            SDKs honor `Retry-After` when present in addition to this flag.
    ApiErrorCode:
      type: string
      description: |-
        Stable error code dictionary. Add variants here when introducing new
        failure modes; never repurpose an existing variant — SDK callers may
        be branching on it.
      enum:
      - invalid
      - unauthorized
      - forbidden
      - not_found
      - gone
      - unprocessable
      - rate_limited
      - internal
      - unavailable
    ApiKeyListResponse:
      type: object
      required:
      - api_keys
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/DashboardApiKey'
    AuthRequest:
      type: object
      description: |-
        Login + signup request body. `password` is the SHA-256 hex digest
        of the user's plaintext password — see `tl-server::auth_user` for
        the storage-side argon2 wrap.
      required:
      - username
      - password
      properties:
        password:
          type: string
          description: SHA-256-hex of the user's plaintext password.
        username:
          type: string
          description: Account identifier. Stored as-given, matched case-insensitively.
    AuthResponse:
      type: object
      description: |-
        Login + signup success response. `user_id` is a v4 UUID rendered as
        a string so SDK type generation stays uniform across languages.
      required:
      - user_id
      - username
      properties:
        user_id:
          type: string
        username:
          type: string
    ChangePasswordRequest:
      type: object
      description: |-
        Change-password request body. The caller demonstrates knowledge of
        the current password by hashing it the same way as a login.
      required:
      - username
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          description: SHA-256-hex of the user's current password.
        new_password:
          type: string
          description: SHA-256-hex of the new password to store.
        username:
          type: string
    Channel:
      type: string
      description: |-
        Channel an agent is operating on. Drives latency budget and matcher selection.

        Flat enum on the wire so SDK type generation stays clean across languages.
        New channels are added as variants here; we don't carry a free-form
        `Other(String)` because it pollutes the Pydantic / TS surface.
      enum:
      - voice
      - chat
      - email
    CheckRequest:
      type: object
      required:
      - agent_id
      - channel
      - input
      - proposed_output
      properties:
        agent_id:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        context: {}
        domain:
          type: string
          description: |-
            Optional domain selector for the dispatcher. Defaults to
            `customer_support` server-side when absent. Reserved for future
            `voice_agent` / `coding_agent` handlers.
          nullable: true
        input:
          type: string
        policies:
          type: array
          items:
            type: string
        proposed_output:
          type: string
        trace_id:
          type: string
          nullable: true
        workspace_id:
          type: string
          nullable: true
    CreateKnowledgeSourceRequest:
      type: object
      required:
      - title
      - kind
      properties:
        file:
          allOf:
          - $ref: '#/components/schemas/KnowledgeFileInput'
          nullable: true
        kind:
          $ref: '#/components/schemas/DashboardKnowledgeSourceKind'
        location:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        title:
          type: string
    DashboardApiKey:
      type: object
      required:
      - id
      - name
      - prefix
      - status
      - created_at
      properties:
        created_at:
          type: string
          description: RFC 3339 timestamp.
        created_by:
          type: string
          nullable: true
        id:
          type: string
        last_used_at:
          type: string
          description: RFC 3339 timestamp.
          nullable: true
        name:
          type: string
        prefix:
          type: string
        status:
          type: string
    DashboardKnowledgeSourceKind:
      type: string
      enum:
      - url
      - file
      - note
    Decision:
      type: object
      required:
      - trace_id
      - verdict
      - reason
      - triggered_policies
      - latency_ms
      properties:
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
        safe_output:
          type: string
          nullable: true
        tier_results:
          type: array
          items:
            $ref: '#/components/schemas/TierResult'
          description: |-
            Per-tier breakdown produced by the parallel-cancel orchestrator.
            Empty for callers that only ran the synchronous `Engine::check`
            path; populated when `Engine::check_async` is used.
        trace_id:
          type: string
        triggered_policies:
          type: array
          items:
            $ref: '#/components/schemas/TriggeredPolicy'
        verdict:
          $ref: '#/components/schemas/Verdict'
    GuardrailGenerateResponse:
      type: object
      description: |-
        Successful response from `POST /v1/agents/{id}/guardrails:generate`.

        Each item is a freshly persisted policy with `enabled=false` —
        callers review the set and flip individual policies on via
        `PATCH /v1/policies/{id}/enabled`.
      required:
      - generated
      properties:
        generated:
          type: array
          items:
            $ref: '#/components/schemas/PolicyDocument'
    GuardrailListResponse:
      type: object
      description: Response from `GET /v1/agents/{id}/guardrails`.
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicySummary'
    KnowledgeFileInput:
      type: object
      required:
      - file_name
      - media_type
      - data_base64
      properties:
        data_base64:
          type: string
        file_name:
          type: string
        media_type:
          type: string
    KnowledgeFileMetadata:
      type: object
      required:
      - file_name
      - media_type
      - byte_size
      - checksum_sha256
      properties:
        byte_size:
          type: integer
          format: int32
        checksum_sha256:
          type: string
        file_name:
          type: string
        media_type:
          type: string
    KnowledgeSource:
      type: object
      required:
      - kb_id
      properties:
        description:
          type: string
          nullable: true
        kb_id:
          type: string
        kind:
          $ref: '#/components/schemas/KnowledgeSourceKind'
        url:
          type: string
          nullable: true
    KnowledgeSourceDocument:
      type: object
      required:
      - id
      - title
      - kind
      - status
      - metadata
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          description: RFC 3339 timestamp.
        id:
          type: string
        kind:
          $ref: '#/components/schemas/DashboardKnowledgeSourceKind'
        last_indexed_at:
          type: string
          description: RFC 3339 timestamp.
          nullable: true
        location:
          type: string
          nullable: true
        metadata: {}
        status:
          $ref: '#/components/schemas/KnowledgeSourceStatus'
        title:
          type: string
        updated_at:
          type: string
          description: RFC 3339 timestamp.
    KnowledgeSourceFileResponse:
      type: object
      required:
      - file_name
      - media_type
      - byte_size
      - data_base64
      properties:
        byte_size:
          type: integer
          format: int32
        data_base64:
          type: string
        file_name:
          type: string
        media_type:
          type: string
    KnowledgeSourceKind:
      type: string
      enum:
      - local
      - web
    KnowledgeSourceListResponse:
      type: object
      required:
      - knowledge_sources
      properties:
        knowledge_sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSourceDocument'
    KnowledgeSourceStatus:
      type: string
      enum:
      - draft
      - indexing
      - ready
      - failed
    PolicyAction:
      type: string
      description: Action a policy takes when matched.
      enum:
      - block
      - rewrite
      - escalate
    PolicyDocument:
      type: object
      required:
      - id
      - severity
      - enabled
      - source_yaml
      properties:
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        id:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        source_yaml:
          type: string
    PolicyDraft:
      type: object
      description: |-
        LLM-drafted policy skeleton. Returned by `POST /v1/policies/draft`,
        rendered as YAML by the caller, then submitted to `/v1/policies` as
        usual. The server does not persist drafts.
      required:
      - id
      - description
      - match_type
      - match_value
      - action
      - severity
      properties:
        action:
          $ref: '#/components/schemas/PolicyAction'
        description:
          type: string
        id:
          type: string
        match_type:
          $ref: '#/components/schemas/PolicyMatchType'
        match_value:
          type: string
        rewrite:
          type: string
          nullable: true
        severity:
          $ref: '#/components/schemas/Severity'
    PolicyDraftRequest:
      type: object
      description: Natural-language description posted to `POST /v1/policies/draft`.
      required:
      - prompt
      properties:
        prompt:
          type: string
    PolicyDraftResponse:
      type: object
      required:
      - draft
      properties:
        draft:
          $ref: '#/components/schemas/PolicyDraft'
    PolicyListResponse:
      type: object
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicySummary'
    PolicyMatchType:
      type: string
      description: |-
        Match-type discriminator for a `PolicyDraft`. Mirrors the YAML shape:
        `match: { literal: "..." }` or `match: { regex: "..." }`.
      enum:
      - literal
      - regex
    PolicySetEnabledRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    PolicySummary:
      type: object
      required:
      - id
      - severity
      - enabled
      properties:
        action:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        id:
          type: string
        owner_agent_id:
          type: string
          nullable: true
        severity:
          $ref: '#/components/schemas/Severity'
    PolicyValidateResponse:
      type: object
      required:
      - valid
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PolicyValidationIssue'
        policy_id:
          type: string
          nullable: true
        valid:
          type: boolean
    PolicyValidationIssue:
      type: object
      required:
      - path
      - message
      properties:
        message:
          type: string
        path:
          type: string
    Severity:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    TraceListResponse:
      type: object
      required:
      - traces
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummary'
    TraceSummary:
      type: object
      required:
      - trace_id
      - domain
      - decision
      - elapsed_ms
      - payload
      - created_at
      properties:
        created_at:
          type: string
          description: RFC 3339 timestamp.
        decision:
          type: string
        domain:
          type: string
        elapsed_ms:
          type: integer
          format: int32
        payload: {}
        trace_id:
          type: string
    TriggeredPolicy:
      type: object
      required:
      - id
      - severity
      - reason
      properties:
        id:
          type: string
        reason:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
    Verdict:
      type: string
      description: What TrustLoopGuard tells the caller to do with the proposed output.
      enum:
      - allow
      - block
      - rewrite
      - escalate
    WorkspaceSettings:
      type: object
      required:
      - default_action
      - telemetry_enabled
      - retention_days
      - config
      properties:
        config: {}
        default_action:
          type: string
        escalation_webhook_url:
          type: string
          nullable: true
        retention_days:
          type: string
        telemetry_enabled:
          type: boolean
        updated_at:
          type: string
          description: RFC 3339 timestamp.
          nullable: true
tags:
- name: guard
  description: Real-time guard checks
- name: agents
  description: Agent profile registration and lookup
- name: policies
  description: Policy authoring and validation
- name: traces
  description: Persisted guard decision traces
- name: api-keys
  description: Workspace runtime API keys
- name: settings
  description: Workspace runtime settings
- name: knowledge-sources
  description: Workspace knowledge source metadata and files
- name: auth
  description: Username/password authentication for self-hosters
