        Channel an agent is operating on. Drives latency budget and matcher selection.

        Flat enum on the wire so SDK type generation stays clean across languages.
        New channels are added as variants here; we don't carry a free-form
        `Other(String)` because it pollutes the Pydantic / TS surface.
      enum:
      - voice
      - chat
      - email
    CheckerFindingEvidence:
      type: object
      description: |-
        One rule violation observed by a checker.

        `recommended_verdict` is what enforce mode applies; in shadow mode it is
        the hypothetical outcome and the decision is left untouched. It is
        absent for verdict-free evidence findings (e.g. "tool not registered,
        parameters unverifiable") that never affect the decision in any mode.
      required:
      - rule
      - reason
      properties:
        failure_mode:
          type:
          - string
          - 'null'
        harm_class:
          type:
          - string
          - 'null'
