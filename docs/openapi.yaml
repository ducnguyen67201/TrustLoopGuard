        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/traces/{trace_id}/review-events:
    get:
      tags:
      - human-review
      operationId: list_review_events
      parameters:
      - name: trace_id
        in: path
        description: Decision trace id
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum events to return, capped at 100
        required: false
        schema:
          type: integer
          nullable: true
          minimum: 0
      responses:
        '200':
          description: Human review events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewEventListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - human-review
      operationId: create_review_event
      parameters:
      - name: trace_id
        in: path
        description: Decision trace id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHumanReviewEventRequest'
        required: true
      responses:
        '201':
          description: Human review event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewEvent'
        '400':
          description: Malformed or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Trace not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    AgentAuthority:
      type: object
      properties:
        can_promise:
          type: array
          items:
            type: string
        cannot_promise:
          type: array
          items:
            type: string
    AgentListResponse:
      type: object
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfile'
    AgentProfile:
      type: object
      description: |-
        What an agent is, what it may claim, and how it should sound.

        Authored as YAML by the customer (see `policies/agents/*.yaml`), parsed
        by `tl-policy::load_agent_str`, persisted in Postgres, cached in process,
        and consulted by Tier 2 (out-of-scope embedding lookup) and Tier 3
        (LLM judge ground truth).
      required:
      - agent_id
      - display_name
      - scope
      - authority
      - tone
      properties:
        agent_id:
          type: string
        authority:
          $ref: '#/components/schemas/AgentAuthority'
        display_name:
          type: string
        escalation_triggers:
          type: array
          items:
            type: string
        knowledge_sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
        scope:
          $ref: '#/components/schemas/AgentScope'
        system_prompt:
          type: string
          description: |-
            Raw system prompt the customer ships to their LLM. Source of truth
            for auto-generating guardrails: `POST /v1/agents/{id}/guardrails:generate`
            reads this and asks an LLM to derive a policy set tailored to it.
            Optional at the type level so existing profiles keep deserializing;
            the generate endpoint enforces presence at call time.
          nullable: true
        tone:
          $ref: '#/components/schemas/AgentTone'
    AgentScope:
      type: object
      properties:
        in_scope:
          type: array
          items:
            type: string
        out_of_scope:
          type: array
          items:
            type: string
    AgentTone:
      type: object
      required:
      - target
      properties:
        forbidden:
          type: array
          items:
            type: string
        target:
          type: string
    AnalyticsCatalogDimension:
      type: object
      required:
      - dimension
      - label
      properties:
        dimension:
          $ref: '#/components/schemas/AnalyticsDimension'
        label:
          type: string
    AnalyticsCatalogMetric:
      type: object
      required:
      - metric
      - label
      - default_chart_type
      properties:
        default_chart_type:
          $ref: '#/components/schemas/AnalyticsChartType'
        label:
          type: string
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
    AnalyticsChartType:
      type: string
      enum:
      - big_number
      - bar
      - line
      - area
      - donut
      - table
    AnalyticsDashboardView:
      type: object
      required:
      - id
      - name
      - is_default
      - config
      - created_at
      - updated_at
      properties:
        config:
          $ref: '#/components/schemas/AnalyticsDashboardViewConfig'
        created_at:
          type: string
        id:
          type: string
        is_default:
          type: boolean
        name:
          type: string
        updated_at:
          type: string
    AnalyticsDashboardViewConfig:
      type: object
      required:
      - filters
      - widgets
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsFilter'
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDashboardWidget'
    AnalyticsDashboardViewListResponse:
      type: object
      required:
      - views
      properties:
        views:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsDashboardView'
    AnalyticsDashboardWidget:
      type: object
      required:
      - id
      - title
      - metric
      - chart_type
      properties:
        chart_type:
          $ref: '#/components/schemas/AnalyticsChartType'
        group_by:
          allOf:
          - $ref: '#/components/schemas/AnalyticsDimension'
          nullable: true
        id:
          type: string
        layout:
          $ref: '#/components/schemas/AnalyticsWidgetLayout'
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
        title:
          type: string
    AnalyticsDimension:
      type: string
      enum:
      - agent_id
      - environment
      - run_kind
      - run_status
      - decision
      - policy_id
      - workflow_step
      - review_outcome
      - external_id
    AnalyticsFacet:
      type: object
      required:
      - dimension
      - label
      - values
      properties:
        dimension:
          $ref: '#/components/schemas/AnalyticsDimension'
        label:
          type: string
        values:
          type: array
          items:
            type: string
    AnalyticsFacetCatalogResponse:
      type: object
      required:
      - metrics
      - dimensions
      - chart_types
      - facets
      properties:
        chart_types:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsChartType'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCatalogDimension'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsFacet'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCatalogMetric'
    AnalyticsFilter:
      type: object
      required:
      - dimension
      - values
      properties:
        dimension:
          $ref: '#/components/schemas/AnalyticsDimension'
        values:
          type: array
          items:
            type: string
    AnalyticsMetric:
      type: string
      enum:
      - trace_count
      - allow_count
      - block_count
      - rewrite_count
      - escalate_count
      - intervention_rate
      - p95_latency_ms
      - human_review_count
      - human_intervention_rate
      - false_positive_rate
    AnalyticsQueryPoint:
      type: object
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: number
          format: double
    AnalyticsQueryRequest:
      type: object
      required:
      - metric
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsFilter'
        group_by:
          allOf:
          - $ref: '#/components/schemas/AnalyticsDimension'
          nullable: true
        limit:
          type: integer
          nullable: true
          minimum: 0
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
    AnalyticsQueryResponse:
      type: object
      required:
      - metric
      - total
      - points
      properties:
        group_by:
          allOf:
          - $ref: '#/components/schemas/AnalyticsDimension'
          nullable: true
        metric:
          $ref: '#/components/schemas/AnalyticsMetric'
        points:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsQueryPoint'
        total:
          type: number
          format: double
    ApiError:
      type: object
      description: |-
        Canonical error envelope returned on non-2xx responses from every
        TrustLoopGuard endpoint. SDKs deserialize this body to produce typed
        errors; integrators don't have to inspect status codes by hand.

        The shape is intentionally minimal — `code` drives SDK-side fan-out,
        `message` is for logs, `retriable` tells callers whether the same
        request may be retried, and `details` is opaque so the server can
        add validation field paths without breaking SDKs.
      required:
      - code
      - message
      - retriable
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        details:
          description: |-
            Opaque structured details (e.g. validation field path).
            Defaults to `null`; servers may add fields without breaking SDKs.
        message:
          type: string
        retriable:
          type: boolean
          description: |-
            Whether the caller may retry the same request without modification.
            SDKs honor `Retry-After` when present in addition to this flag.
    ApiErrorCode:
      type: string
      description: |-
        Stable error code dictionary. Add variants here when introducing new
        failure modes; never repurpose an existing variant — SDK callers may
        be branching on it.
      enum:
      - invalid
      - unauthorized
      - forbidden
      - not_found
      - gone
      - unprocessable
      - rate_limited
      - internal
      - unavailable
    ApiKeyBatchRevokeRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
    ApiKeyBatchRevokeResponse:
      type: object
      required:
      - api_keys
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/DashboardApiKey'
    ApiKeyListResponse:
      type: object
      required:
      - api_keys
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/DashboardApiKey'
    AuthRequest:
      type: object
      description: |-
        Login + signup request body. `password` is the SHA-256 hex digest
        of the user's plaintext password — see `tl-server::auth_user` for
        the storage-side argon2 wrap.
      required:
      - username
      - password
      properties:
        password:
          type: string
          description: SHA-256-hex of the user's plaintext password.
        username:
          type: string
          description: Account identifier. Stored as-given, matched case-insensitively.
    AuthResponse:
      type: object
      description: |-
        Login + signup success response. `user_id` is a v4 UUID rendered as
        a string so SDK type generation stays uniform across languages.
      required:
      - user_id
      - username
      properties:
        jwt:
          type: string
          description: |-
            Signed bearer token (HS256) issued by `tl-server` on successful
            signup or login. The web dashboard stashes this in the
            NextAuth session and forwards it on every Rust API call as
            `Authorization: Bearer <jwt>`. Absent when the server runs
            without `TL_JWT_SECRET` configured (memory-only dev mode).
          nullable: true
        user_id:
          type: string
        username:
          type: string
    ChangePasswordRequest:
      type: object
      description: |-
        Change-password request body. The caller demonstrates knowledge of
        the current password by hashing it the same way as a login.
      required:
      - username
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          description: SHA-256-hex of the user's current password.
        new_password:
          type: string
          description: SHA-256-hex of the new password to store.
        username:
          type: string
    Channel:
      type: string
      description: |-
        Channel an agent is operating on. Drives latency budget and matcher selection.

        Flat enum on the wire so SDK type generation stays clean across languages.
        New channels are added as variants here; we don't carry a free-form
        `Other(String)` because it pollutes the Pydantic / TS surface.
      enum:
      - voice
      - chat
      - email
    CheckRequest:
      type: object
      required:
      - agent_id
      - channel
      - input
      - proposed_output
      properties:
        agent_id:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        context: {}
        domain:
          type: string
          description: |-
            Optional domain selector for the dispatcher. Defaults to
            `customer_support` server-side when absent. Reserved for future
            `voice_agent` / `coding_agent` handlers.
          nullable: true
        input:
          type: string
        policies:
          type: array
          items:
            type: string
        proposed_output:
          type: string
        redaction:
          allOf:
          - $ref: '#/components/schemas/RedactionInfo'
          nullable: true
        run_event:
          allOf:
          - $ref: '#/components/schemas/CreateRunEventRequest'
          nullable: true
        run_event_id:
          type: string
          nullable: true
          format: uuid
        run_id:
          type: string
          nullable: true
          format: uuid
        trace_id:
          type: string
          nullable: true
        workspace_id:
          type: string
          nullable: true
      allOf:
      - not:
          required:
          - run_event
          - run_event_id
      - anyOf:
        - not:
            required:
            - run_event
        - required:
          - run_id
      - anyOf:
        - not:
            required:
            - run_event_id
        - required:
          - run_id
    CreateAnalyticsDashboardViewRequest:
      type: object
      required:
      - name
      - config
      properties:
        config:
          $ref: '#/components/schemas/AnalyticsDashboardViewConfig'
        is_default:
          type: boolean
        name:
          type: string
    CreateApiKeyRequest:
      type: object
      required:
      - name
      properties:
        environment_id:
          type: string
          nullable: true
        name:
          type: string
    CreateApiKeyResponse:
      type: object
      required:
      - api_key
      - plaintext_key
      properties:
        api_key:
          $ref: '#/components/schemas/DashboardApiKey'
        plaintext_key:
          type: string
          description: Full bearer key. Returned only once at creation time.
    CreateEnforcementProfileRequest:
      type: object
      required:
      - display_name
      - input_action
      - output_action
      - fail_mode
      - retention_mode
      - fallback_message
      properties:
        display_name:
          type: string
        fail_mode:
          $ref: '#/components/schemas/FailMode'
        fallback_message:
          type: string
        id:
          type: string
          nullable: true
        input_action:
          $ref: '#/components/schemas/GatewayInputAction'
        max_regenerations:
          type: integer
          format: int32
          minimum: 0
        output_action:
          $ref: '#/components/schemas/GatewayOutputAction'
        response_mode:
          $ref: '#/components/schemas/ResponseMode'
        retention_mode:
          $ref: '#/components/schemas/RetentionMode'
    CreateGatewayProviderConnectionRequest:
      type: object
      required:
      - display_name
      - kind
      - default_model
      - provider_api_key
      properties:
        base_url:
          type: string
          nullable: true
        default_model:
          type: string
        display_name:
          type: string
        id:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/GatewayProviderKind'
        provider_api_key:
          type: string
    CreateGatewayRouteRequest:
      type: object
