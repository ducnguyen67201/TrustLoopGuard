          nullable: true
        environment:
          type: string
        environment_id:
          type: string
        id:
          type: string
        last_used_at:
          type: string
          description: RFC 3339 timestamp.
          nullable: true
        name:
          type: string
        prefix:
          type: string
        status:
          type: string
    DashboardKnowledgeSourceKind:
      type: string
