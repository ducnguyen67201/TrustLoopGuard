openapi: 3.0.3
info:
  title: TrustLoopGuard API
  description: Real-time guardrail runtime for AI agents.
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - guard
      operationId: health
      responses:
        '200':
          description: Liveness probe
          content:
            text/plain:
              schema:
                type: string
  /v1/agents:
    get:
      tags:
      - agents
      summary: '`GET /v1/agents`. Returns all registered profiles. Bypasses the'
      description: store's read cache because admin-list isn't on the hot path.
      operationId: list_agents
      responses:
        '200':
          description: All agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - agents
      summary: '`POST /v1/agents` — upsert a profile. Body is YAML (when'
      description: '`Content-Type` is `*yaml*`) or JSON.'
      operationId: upsert_agent
      requestBody:
        description: Agent profile, YAML or JSON
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/AgentProfile'
        required: true
      responses:
        '201':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Profile failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}:
    get:
      tags:
      - agents
      summary: '`GET /v1/agents/:id`.'
      operationId: get_agent
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - agents
      summary: '`DELETE /v1/agents/:id`. Soft-delete via the store.'
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Profile deleted
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/check:
    post:
      tags:
      - guard
      operationId: check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
        required: true
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: API version no longer served
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies:
    get:
      tags:
      - policies
      summary: '`GET /v1/policies` — list active policy summaries.'
      operationId: list_policies
      responses:
        '200':
          description: All active policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - policies
      summary: '`POST /v1/policies` — create or update a policy from YAML or JSON.'
      operationId: upsert_policy
      requestBody:
        description: Policy document, YAML or JSON
        content:
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        '201':
          description: Policy created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Policy failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/validate:
    post:
      tags:
      - policies
      summary: '`POST /v1/policies/validate` — validate policy YAML or JSON without saving it.'
      operationId: validate_policy
      requestBody:
        description: Policy document, YAML or JSON
        content:
          application/yaml:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidateResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/{id}:
    get:
      tags:
      - policies
      summary: '`GET /v1/policies/:id` — fetch a policy document.'
      operationId: get_policy
      parameters:
      - name: id
        in: path
        description: Policy identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - policies
      summary: '`DELETE /v1/policies/:id` — soft-delete a policy.'
      operationId: delete_policy
      parameters:
      - name: id
        in: path
        description: Policy identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Policy deleted
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/policies/{id}/enabled:
    patch:
      tags:
      - policies
      summary: '`PATCH /v1/policies/:id/enabled` — enable or disable a policy.'
      operationId: set_policy_enabled
      parameters:
      - name: id
        in: path
        description: Policy identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySetEnabledRequest'
        required: true
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDocument'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    AgentAuthority:
      type: object
      properties:
        can_promise:
          type: array
          items:
            type: string
        cannot_promise:
          type: array
          items:
            type: string
    AgentListResponse:
      type: object
      required:
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentProfile'
    AgentProfile:
      type: object
      description: |-
        What an agent is, what it may claim, and how it should sound.

        Authored as YAML by the customer (see `policies/agents/*.yaml`), parsed
        by `tl-policy::load_agent_str`, persisted in Postgres, cached in process,
        and consulted by Tier 2 (out-of-scope embedding lookup) and Tier 3
        (LLM judge ground truth).
      required:
      - agent_id
      - display_name
      - scope
      - authority
      - tone
      properties:
        agent_id:
          type: string
        authority:
          $ref: '#/components/schemas/AgentAuthority'
        display_name:
          type: string
        escalation_triggers:
          type: array
          items:
            type: string
        knowledge_sources:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSource'
        scope:
          $ref: '#/components/schemas/AgentScope'
        tone:
          $ref: '#/components/schemas/AgentTone'
    AgentScope:
      type: object
      properties:
        in_scope:
          type: array
          items:
            type: string
        out_of_scope:
          type: array
          items:
            type: string
    AgentTone:
      type: object
      required:
      - target
      properties:
        forbidden:
          type: array
          items:
            type: string
        target:
          type: string
    ApiError:
      type: object
      description: |-
        Canonical error envelope returned on non-2xx responses from every
        TrustLoopGuard endpoint. SDKs deserialize this body to produce typed
        errors; integrators don't have to inspect status codes by hand.

        The shape is intentionally minimal — `code` drives SDK-side fan-out,
        `message` is for logs, `retriable` tells callers whether the same
        request may be retried, and `details` is opaque so the server can
        add validation field paths without breaking SDKs.
      required:
      - code
      - message
      - retriable
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        details:
          description: |-
            Opaque structured details (e.g. validation field path).
            Defaults to `null`; servers may add fields without breaking SDKs.
        message:
          type: string
        retriable:
          type: boolean
          description: |-
            Whether the caller may retry the same request without modification.
            SDKs honor `Retry-After` when present in addition to this flag.
    ApiErrorCode:
      type: string
      description: |-
        Stable error code dictionary. Add variants here when introducing new
        failure modes; never repurpose an existing variant — SDK callers may
        be branching on it.
      enum:
      - invalid
      - unauthorized
      - forbidden
      - not_found
      - gone
      - unprocessable
      - rate_limited
      - internal
      - unavailable
    Channel:
      type: string
      description: |-
        Channel an agent is operating on. Drives latency budget and matcher selection.

        Flat enum on the wire so SDK type generation stays clean across languages.
        New channels are added as variants here; we don't carry a free-form
        `Other(String)` because it pollutes the Pydantic / TS surface.
      enum:
      - voice
      - chat
      - email
    CheckRequest:
      type: object
      required:
      - agent_id
      - channel
      - input
      - proposed_output
      properties:
        agent_id:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        context: {}
        domain:
          type: string
          description: |-
            Optional domain selector for the dispatcher. Defaults to
            `customer_support` server-side when absent. Reserved for future
            `voice_agent` / `coding_agent` handlers.
          nullable: true
        input:
          type: string
        policies:
          type: array
          items:
            type: string
        proposed_output:
          type: string
        trace_id:
          type: string
          nullable: true
    Decision:
      type: object
      required:
      - trace_id
      - verdict
      - reason
      - triggered_policies
      - latency_ms
      properties:
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
        safe_output:
          type: string
          nullable: true
        tier_results:
          type: array
          items:
            $ref: '#/components/schemas/TierResult'
          description: |-
            Per-tier breakdown produced by the parallel-cancel orchestrator.
            Empty for callers that only ran the synchronous `Engine::check`
            path; populated when `Engine::check_async` is used.
        trace_id:
          type: string
        triggered_policies:
          type: array
          items:
            $ref: '#/components/schemas/TriggeredPolicy'
        verdict:
          $ref: '#/components/schemas/Verdict'
    KnowledgeSource:
      type: object
      required:
      - kb_id
      properties:
        kb_id:
          type: string
    PolicyDocument:
      type: object
      required:
      - id
      - severity
      - enabled
      - source_yaml
      properties:
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        id:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        source_yaml:
          type: string
    PolicyListResponse:
      type: object
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicySummary'
    PolicySetEnabledRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    PolicySummary:
      type: object
      required:
      - id
      - severity
      - enabled
      properties:
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        id:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
    PolicyValidateResponse:
      type: object
      required:
      - valid
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PolicyValidationIssue'
        policy_id:
          type: string
          nullable: true
        valid:
          type: boolean
    PolicyValidationIssue:
      type: object
      required:
      - path
      - message
      properties:
        message:
          type: string
        path:
          type: string
    Severity:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    TriggeredPolicy:
      type: object
      required:
      - id
      - severity
      - reason
      properties:
        id:
          type: string
        reason:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
    Verdict:
      type: string
      description: What TrustLoopGuard tells the caller to do with the proposed output.
      enum:
      - allow
      - block
      - rewrite
      - escalate
tags:
- name: guard
  description: Real-time guard checks
- name: agents
  description: Agent profile registration and lookup
- name: policies
  description: Policy authoring and validation
