          type: string
        triggered_policies:
          type: array
          items:
            $ref: '#/components/schemas/TriggeredPolicy'
        verdict:
          $ref: '#/components/schemas/Verdict'
    EnforcementProfile:
      type: object
      required:
      - id
      - display_name
      - input_action
      - output_action
      - fail_mode
      - retention_mode
      - fallback_message
      - max_regenerations
      - created_at
      - updated_at
