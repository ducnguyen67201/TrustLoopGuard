      type: string
      description: What TrustLoopGuard tells the caller to do with the proposed output.
      enum:
      - allow
      - block
      - rewrite
      - escalate
    VerifyResult:
      type: object
      description: |-
        Outcome of re-running a candidate policy through the engine before
        recommending it. A candidate `passed` only when it blocks every landed
        case, blocks enough obfuscated variants, and false-blocks no controls.
      required:
      - blocked_landed
      - landed_total
      - blocked_variants
      - variant_total
      - false_blocks
      - control_total
      - passed
      properties:
        blocked_landed:
          type: integer
          format: int32
          description: Landed cases the candidate now blocks, over the landed cases tested.
          minimum: 0
        blocked_variants:
          type: integer
          format: int32
          description: Obfuscated/paraphrased variants the candidate blocks, over those tested.
          minimum: 0
        control_total:
          type: integer
          format: int32
          minimum: 0
        false_blocks:
          type: integer
          format: int32
          description: Benign control cases the candidate wrongly blocks, over those tested.
          minimum: 0
        landed_total:
          type: integer
          format: int32
          minimum: 0
        passed:
          type: boolean
        variant_total:
          type: integer
          format: int32
          minimum: 0
    WorkflowDefinition:
      type: object
      description: |-
        A machine-readable agent definition imported for hardening. `source` names
        the format (`n8n` today; the analyser keys off it), `definition` is the raw
        exported JSON kept verbatim so we never lose fidelity round-tripping.

        ponytail: a struct, not a tagged `Chat | WorkflowJson | ToolSchema` enum —
        "chat" is just the absence of this field, and tool-schema import has no
        caller yet. Add a `source` value (and an analyser arm) when a second format
        actually arrives.
      required:
      - source
      - definition
      properties:
        definition:
          description: Raw exported workflow JSON, kept verbatim.
        source:
          type: string
          description: Format discriminator, e.g. `n8n`.
    WorkflowPath:
      type: object
      description: |-
        One injectable `source → sink` path found by the static workflow analyzer.
        An untrusted `source` node can reach a dangerous `sink` node through the
        workflow's connections, so data the source carries can drive the sink.
      required:
      - source_node
      - source_type
      - source_category
      - sink_node
      - sink_type
      - sink_category
      properties:
        sink_category:
          type: string
          description: Coarse sink category, e.g. `http`, `email_send`, `database`, `code_exec`.
        sink_node:
          type: string
          description: Node name of the dangerous operation.
        sink_type:
          type: string
          description: Raw node type, e.g. `n8n-nodes-base.httpRequest`.
        source_category:
          type: string
          description: Coarse source category, e.g. `email_read`, `webhook`, `form`, `document`.
        source_node:
          type: string
          description: Node name of the untrusted entry point.
        source_type:
          type: string
          description: Raw node type, e.g. `n8n-nodes-base.emailReadImap`.
