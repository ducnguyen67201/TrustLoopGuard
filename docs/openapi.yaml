          - string
          - 'null'
        rule:
          type: string
        source_chain:
          type: array
          items:
            type: string
    CheckerRun:
      type: object
      description: |-
        Evidence for one checker evaluation, attached by the event pipeline.

        Recorded whenever a checker runs (shadow or enforce). A checker in
        `off` mode records nothing.
      required:
