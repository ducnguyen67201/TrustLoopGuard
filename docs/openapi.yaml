    Origin:
      type: string
      enum:
      - user
      - system
      - tool
      - memory
      - file
      - web
      - email
      - api
      - unknown
    ParamLimit:
      type: object
      description: |-
        Inclusive numeric bounds for a parameter, expressed in the tool's own
        minor units (e.g. cents for a money amount). The value-limit checker
        reads the parameter at [`ParamSpec::path`], coerces it to an integer,
        and emits [`on_breach`](ParamLimit::on_breach) when it falls outside
        `[min, max]`. Integer units keep the type `Eq` and sidestep float
        comparison ambiguity; the checker is currency-agnostic, so the registry
        author is responsible for declaring `max`/`min` in the same unit the
        agent passes.
      properties:
        max:
          type:
          - integer
          - 'null'
          format: int64
          description: Inclusive maximum. A value greater than this breaches the limit.
        min:
          type:
          - integer
          - 'null'
          format: int64
          description: Inclusive minimum. A value less than this breaches the limit.
        on_breach:
          $ref: '#/components/schemas/LimitAction'
          description: Verdict to recommend when a bound is breached. Defaults to `Block`.
    ParamRole:
      type: string
      enum:
      - authority_bearing
      - content_bearing
    ParamSpec:
      type: object
      required:
      - path
      - role
      properties:
        allowed_sources:
          type: array
          items:
            $ref: '#/components/schemas/AllowedSource'
        limit:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ParamLimit'
            description: |-
              Optional inclusive numeric bounds on this parameter's value, checked
              by the value-limit checker. `None` means the value is unconstrained.
        path:
          type: string
        role:
          $ref: '#/components/schemas/ParamRole'
    PolicyAction:
