      properties:
        agent_id:
          type: string
        display_name:
          type: string
        enforcement_profile_id:
          type: string
        id:
          type: string
          nullable: true
        provider_connection_id:
          type: string
    CreateHumanReviewEventRequest:
      type: object
      required:
      - outcome
      properties:
        metadata: {}
        note:
          type: string
          nullable: true
        outcome:
          $ref: '#/components/schemas/HumanReviewOutcome'
        reason_codes:
          type: array
          items:
            type: string
    CreateInviteRequest:
      type: object
      description: POST `/v1/team/invites` request body.
      required:
      - email
      - role
      properties:
        email:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    CreateInviteResponse:
      oneOf:
      - type: object
        required:
        - member
        - kind
        properties:
          kind:
            type: string
            enum:
            - added
          member:
            $ref: '#/components/schemas/WorkspaceMember'
      - type: object
        required:
        - invite
        - kind
        properties:
          invite:
            $ref: '#/components/schemas/WorkspaceInvite'
          kind:
            type: string
            enum:
            - invited
      description: |-
        POST `/v1/team/invites` outcome. Discriminated by `kind`:
        - `added` — the email matched an existing user; they're now a
        workspace member. No accept step needed.
        - `invited` — no account exists for that email yet; we recorded
        a pending membership intent. When the user signs up with this
        email (any time, anywhere), they're auto-joined on their next
        page load via the `accept_pending_invites_for_email` path.
      discriminator:
        propertyName: kind
    CreateKnowledgeSourceRequest:
      type: object
