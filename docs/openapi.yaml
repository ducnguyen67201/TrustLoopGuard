        expires_at:
          type:
          - string
          - 'null'
        reason:
          type: string
        required:
          type: boolean
    ApprovalRule:
      type: object
      required:
      - required
      properties:
        approver_roles:
          type: array
          items:
            type: string
        reason:
          type:
          - string
          - 'null'
        required:
          type: boolean
    AttackVector:
      type: object
      description: One tailored attack vector derived from the agent's definition.
      required:
      - goal
      - technique
      - target_operation
      - injection_payload
      properties:
        goal:
          type: string
          description: |-
            What the attacker is trying to make the agent do (the objective the
            runner scores against).
        injection_payload:
          type: string
          description: |-
            Concrete seed payload to inject. The private runner strengthens this —
            it is a starting point, not the final attack.
        source_path:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/WorkflowPath'
            description: |-
              Provenance: the `source → sink` path this vector exploits, when derived
              from a workflow. `null` for chat-derived vectors.
        target_operation:
          type: string
          description: |-
            The operation the vector aims at: a workflow sink category (e.g.
            `http`, `email_send`) or `chat_reply` for a pure chat agent.
        technique:
          type: string
          description: |-
            Technique class, e.g. `indirect_prompt_injection`, `instruction_override`,
            `data_exfiltration`, `tool_misuse`, `scope_violation`.
    AuthRequest:
      type: object
      description: |-
        Login + signup request body. `password` is the SHA-256 hex digest
        of the user's plaintext password — see `tl-server::auth_user` for
        the storage-side argon2 wrap.
      required:
      - username
      - password
      properties:
        password:
          type: string
          description: SHA-256-hex of the user's plaintext password.
        username:
          type: string
          description: Account identifier. Stored as-given, matched case-insensitively.
    AuthResponse:
      type: object
      description: |-
        Login + signup success response. `user_id` is a v4 UUID rendered as
        a string so SDK type generation stays uniform across languages.
      required:
      - user_id
      - username
      properties:
        jwt:
          type:
          - string
          - 'null'
          description: |-
            Signed bearer token (HS256) issued by `tl-server` on successful
            signup or login. The web dashboard stashes this in the
            NextAuth session and forwards it on every Rust API call as
            `Authorization: Bearer <jwt>`. Absent when the server runs
            without `TL_JWT_SECRET` configured (memory-only dev mode).
        user_id:
          type: string
        username:
          type: string
    BudgetAlertConfig:
      type: object
      description: One configured alert threshold.
      required:
      - id
      - workspace_id
      - name
      - window
      - threshold_type
      - threshold_value
      - enabled
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          description: RFC 3339 timestamps.
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        principal_id:
          type:
          - string
          - 'null'
          description: |-
            `null` = any principal; the alert is evaluated per acting
            principal.
        threshold_type:
          $ref: '#/components/schemas/BudgetAlertThresholdType'
        threshold_value:
          type: integer
          format: int64
        updated_at:
          type: string
        webhook_url:
          type:
          - string
          - 'null'
          description: |-
            Delivery target. `null` falls back to the workspace
            `escalation_webhook_url`; with neither set, firings are still
            recorded but nothing is sent.
        window:
          $ref: '#/components/schemas/BudgetAlertWindow'
        workspace_id:
          type: string
    BudgetAlertConfigListResponse:
      type: object
      required:
      - configs
      properties:
        configs:
          type: array
          items:
            $ref: '#/components/schemas/BudgetAlertConfig'
    BudgetAlertFiring:
      type: object
      description: |-
        One recorded threshold crossing — at most one per (config,
        principal, window).
      required:
      - id
      - workspace_id
      - config_id
      - principal_id
      - window_start
      - cap_minor
      - spent_minor
      - currency
      - payload
      - fired_at
      properties:
        cap_minor:
          type: integer
          format: int64
        config_id:
          type: string
        currency:
          type: string
        fired_at:
          type: string
          description: RFC 3339 timestamp.
        id:
          type: string
        payload:
          description: The exact JSON body delivered to the webhook.
        principal_id:
          type: string
        spent_minor:
          type: integer
          format: int64
        window_start:
          type: string
          description: RFC 3339 window boundary the dedup key is anchored to.
        workspace_id:
          type: string
    BudgetAlertFiringListResponse:
      type: object
      required:
      - firings
      properties:
        firings:
          type: array
          items:
            $ref: '#/components/schemas/BudgetAlertFiring'
    BudgetAlertThresholdType:
      type: string
      description: |-
        How `threshold_value` is read: `percent` fires when spend reaches
        that percentage of the window's cap (1-100); `absolute` fires when
        the remaining budget (cap - spent) drops to the value, in currency
        minor units.
      enum:
      - percent
      - absolute
    BudgetAlertWindow:
      type: string
      description: |-
        Which budget window the threshold watches. Windows share the hard
        caps' boundaries: day at 00:00 UTC, week from Monday 00:00 UTC,
        month from the 1st.
      enum:
      - day
      - week
      - month
    ChangePasswordRequest:
      type: object
      description: |-
