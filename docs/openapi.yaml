openapi: 3.0.3
info:
  title: TrustLoopGuard API
  description: Real-time guardrail runtime for AI agents.
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - guard
      operationId: health
      responses:
        '200':
          description: Liveness probe
          content:
            text/plain:
              schema:
                type: string
  /v1/check:
    post:
      tags:
      - guard
      operationId: check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
        required: true
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          description: API version no longer served
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      description: |-
        Canonical error envelope returned on non-2xx responses from every
        TrustLoopGuard endpoint. SDKs deserialize this body to produce typed
        errors; integrators don't have to inspect status codes by hand.

        The shape is intentionally minimal — `code` drives SDK-side fan-out,
        `message` is for logs, `retriable` tells callers whether the same
        request may be retried, and `details` is opaque so the server can
        add validation field paths without breaking SDKs.
      required:
      - code
      - message
      - retriable
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        details:
          description: |-
            Opaque structured details (e.g. validation field path).
            Defaults to `null`; servers may add fields without breaking SDKs.
        message:
          type: string
        retriable:
          type: boolean
          description: |-
            Whether the caller may retry the same request without modification.
            SDKs honor `Retry-After` when present in addition to this flag.
    ApiErrorCode:
      type: string
      description: |-
        Stable error code dictionary. Add variants here when introducing new
        failure modes; never repurpose an existing variant — SDK callers may
        be branching on it.
      enum:
      - invalid
      - unauthorized
      - forbidden
      - not_found
      - gone
      - unprocessable
      - rate_limited
      - internal
      - unavailable
    Channel:
      type: string
      description: |-
        Channel an agent is operating on. Drives latency budget and matcher selection.

        Flat enum on the wire so SDK type generation stays clean across languages.
        New channels are added as variants here; we don't carry a free-form
        `Other(String)` because it pollutes the Pydantic / TS surface.
      enum:
      - voice
      - chat
      - email
    CheckRequest:
      type: object
      required:
      - agent_id
      - channel
      - input
      - proposed_output
      properties:
        agent_id:
          type: string
        channel:
          $ref: '#/components/schemas/Channel'
        context: {}
        domain:
          type: string
          description: |-
            Optional domain selector for the dispatcher. Defaults to
            `customer_support` server-side when absent. Reserved for future
            `voice_agent` / `coding_agent` handlers.
          nullable: true
        input:
          type: string
        policies:
          type: array
          items:
            type: string
        proposed_output:
          type: string
        trace_id:
          type: string
          nullable: true
    Decision:
      type: object
      required:
      - trace_id
      - verdict
      - reason
      - triggered_policies
      - latency_ms
      properties:
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: string
        safe_output:
          type: string
          nullable: true
        tier_results:
          type: array
          items:
            $ref: '#/components/schemas/TierResult'
          description: |-
            Per-tier breakdown produced by the parallel-cancel orchestrator.
            Empty for callers that only ran the synchronous `Engine::check`
            path; populated when `Engine::check_async` is used.
        trace_id:
          type: string
        triggered_policies:
          type: array
          items:
            $ref: '#/components/schemas/TriggeredPolicy'
        verdict:
          $ref: '#/components/schemas/Verdict'
    Severity:
      type: string
      enum:
      - low
      - medium
      - high
      - critical
    TriggeredPolicy:
      type: object
      required:
      - id
      - severity
      - reason
      properties:
        id:
          type: string
        reason:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
    Verdict:
      type: string
      description: What TrustLoopGuard tells the caller to do with the proposed output.
      enum:
      - allow
      - block
      - rewrite
      - escalate
tags:
- name: guard
  description: Real-time guard checks
