openapi: 3.1.0
info:
  title: TrustLoopGuard API
  description: Real-time guardrail runtime for AI agents.
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /health:
    get:
      tags:
      - guard
      operationId: health
      responses:
        '200':
          description: Liveness probe
          content:
            text/plain:
              schema:
                type: string
  /v1/agents:
    get:
      tags:
      - agents
      summary: |-
        `GET /v1/agents`. Returns all registered profiles. Bypasses the
        store's read cache because admin-list isn't on the hot path.
      operationId: list_agents
      responses:
        '200':
          description: All agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - agents
      summary: |-
        `POST /v1/agents` — upsert a profile. Body is YAML (when
        `Content-Type` is `*yaml*`) or JSON.
      operationId: upsert_agent
      requestBody:
        description: Agent profile, YAML or JSON
        content:
          application/yaml:
            schema:
              $ref: '#/components/schemas/AgentProfile'
        required: true
      responses:
        '201':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Profile failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}:
    get:
      tags:
      - agents
      summary: '`GET /v1/agents/:id`.'
      operationId: get_agent
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags:
      - agents
      summary: '`DELETE /v1/agents/:id`. Soft-delete via the store.'
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Profile deleted
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/guardrails:
    get:
      tags:
      - agents
      summary: |-
        `GET /v1/agents/{id}/guardrails` — list active policies owned by an
        agent. Does not require the agent to exist; missing agent → empty list.
      operationId: list_guardrails
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Policies owned by the agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/guardrails/generate:
    post:
      tags:
      - agents
      summary: |-
        `POST /v1/agents/{id}/guardrails/generate` — derive a set of
        guardrail policies tailored to an agent's stored `system_prompt`,
        auto-persist them with `enabled=false`, and return what was saved.
      description: |-
        Callers review the set and flip individual policies on via
        `PATCH /v1/policies/{id}/enabled`. Runtime checks never see these
        policies until that happens (because runtime event evaluation filters by enabled).
      operationId: generate_guardrails
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Generated and persisted policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailGenerateResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Agent has no system_prompt to derive guardrails from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: LLM provider failed or returned invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: LLM is not configured on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/redteam/plan:
    post:
      tags:
      - redteam
      operationId: plan_attack_vectors
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedteamPlanRequest'
        required: true
      responses:
        '200':
          description: Saved, named attack plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedteamPlanResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Agent has no system_prompt or workflow to plan from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '502':
          description: LLM provider failed or returned invalid shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: LLM is not configured on this deployment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/redteam/plans:
    get:
      tags:
      - redteam
      operationId: list_plans
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The agent's saved attack plans, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedteamPlanListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/agents/{id}/redteam/static-policies:
    post:
      tags:
      - redteam
      summary: |-
        `POST /v1/agents/{id}/redteam/static-policies` — synthesize **preventive**
        guardrails from the workflow analyzer's `source → sink` paths and attach
        them to the agent `enabled = false` (operator opts in via
        `PATCH /v1/policies/{id}/enabled`). The static twin of `harden`: coverage
        without an attack. No exposure ⇒ an empty set, never a fabricated policy.
      operationId: generate_static_policies
      parameters:
      - name: id
        in: path
        description: Agent identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Generated + persisted preventive policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailGenerateResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Agent not registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Agent has no workflow_definition to derive static policies from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/analytics/catalog:
    get:
      tags:
      - analytics
      operationId: catalog
      responses:
        '200':
          description: Analytics metric and facet catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsFacetCatalogResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot access analytics for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/analytics/human-review:
    get:
      tags:
      - human-review
      operationId: human_review_analytics
      parameters:
      - name: agent_id
        in: query
        description: Filter by agent id
        required: false
        schema:
          type: string
      - name: policy_id
        in: query
        description: Filter by policy id
        required: false
        schema:
          type: string
      - name: run_kind
        in: query
        description: Filter by run kind
        required: false
        schema:
          type: string
      - name: workflow_step
        in: query
        description: Filter by workflow step
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Human review analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewAnalyticsResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/analytics/query:
    post:
      tags:
      - analytics
      operationId: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsQueryRequest'
        required: true
      responses:
        '200':
          description: Analytics query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsQueryResponse'
        '400':
          description: Malformed or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot access analytics for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/analytics/views:
    get:
      tags:
      - analytics
      operationId: list_views
      responses:
        '200':
          description: Saved analytics dashboard views
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardViewListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot access analytics for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - analytics
      operationId: create_view
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalyticsDashboardViewRequest'
        required: true
      responses:
        '201':
          description: Saved analytics dashboard view created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardView'
        '400':
          description: Malformed or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot access analytics for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/analytics/views/{id}:
    delete:
      tags:
      - analytics
      operationId: delete_view
      parameters:
      - name: id
        in: path
        description: Saved dashboard view id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Saved analytics dashboard view deleted
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot access analytics for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Saved view not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags:
      - analytics
      operationId: update_view
      parameters:
      - name: id
        in: path
        description: Saved dashboard view id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalyticsDashboardViewRequest'
        required: true
      responses:
        '200':
          description: Saved analytics dashboard view updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsDashboardView'
        '400':
          description: Malformed or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot access analytics for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Saved view not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/api-keys:
    get:
      tags:
      - api-keys
      summary: '`GET /v1/api-keys` - list workspace runtime API keys.'
      operationId: list_api_keys
      responses:
        '200':
          description: Workspace API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot manage API keys for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - api-keys
      summary: '`POST /v1/api-keys` - create a workspace runtime API key.'
      operationId: create_api_key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        '201':
          description: Workspace API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot manage API keys for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/api-keys/batch/revoke:
    patch:
      tags:
      - api-keys
      summary: '`PATCH /v1/api-keys/batch/revoke` - revoke workspace runtime API keys.'
      operationId: batch_revoke_api_keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyBatchRevokeRequest'
        required: true
      responses:
        '200':
          description: Workspace API keys revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyBatchRevokeResponse'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Caller cannot manage API keys for this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: One or more API keys were not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: '`POST /v1/auth/login` — verify credentials.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '200':
          description: Credentials accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Password auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/password:
    post:
      tags:
      - auth
      summary: '`POST /v1/auth/password` — change an existing user''s password.'
      description: |-
        The caller must demonstrate knowledge of the current password by
        including it in the request. tl-server does not issue per-user
        session tokens (see `docs/concept/authorization.md`); the
        current-password check is what proves account ownership here.
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Current password did not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Password auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/signup:
    post:
      tags:
      - auth
      summary: '`POST /v1/auth/signup` — create a new account.'
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Password auth disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/enforcement-profiles:
    get:
      tags:
      - gateway
      operationId: list_enforcement_profiles
      responses:
        '200':
          description: Enforcement profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcementProfileListResponse'
        '403':
          description: Workspace runtime keys cannot manage gateway configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - gateway
      operationId: create_enforcement_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnforcementProfileRequest'
        required: true
      responses:
        '201':
          description: Enforcement profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcementProfile'
        '403':
          description: Workspace runtime keys cannot manage gateway configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/enforcement-profiles/{id}:
    patch:
      tags:
      - gateway
      operationId: patch_enforcement_profile
      parameters:
      - name: id
        in: path
        description: Enforcement profile id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnforcementProfileRequest'
        required: true
      responses:
        '200':
          description: Enforcement profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcementProfile'
        '403':
          description: Workspace runtime keys cannot manage gateway configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/environments:
    get:
      tags:
      - environments
      operationId: list_environments
      responses:
        '200':
          description: Workspace environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvironmentListResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags:
      - environments
      operationId: create_environment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceEnvironmentRequest'
        required: true
      responses:
        '201':
          description: Workspace environment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceEnvironment'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/environments/{environment_id}/checker-modes:
    get:
      tags:
      - settings
      summary: |-
        `GET /v1/environments/{environment_id}/checker-modes` - read
        per-environment checker-mode overrides. Fields set to `null` (or an
        all-empty body) inherit the workspace-level modes.
      operationId: get_environment_checker_modes
      parameters:
      - name: environment_id
        in: path
        description: Environment id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Per-environment checker-mode overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentCheckerModes'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - settings
      summary: |-
        `PUT /v1/environments/{environment_id}/checker-modes` - replace
        per-environment checker-mode overrides. Omitted fields inherit the
        workspace-level modes. Writes require an Owner/Admin user; workspace
        runtime keys are rejected like `PATCH /v1/settings`.
      operationId: put_environment_checker_modes
      parameters:
      - name: environment_id
        in: path
        description: Environment id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentCheckerModesRequest'
        required: true
      responses:
        '200':
          description: Persisted per-environment checker-mode overrides
          content:
            application/json:
              schema:
