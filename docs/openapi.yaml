      - updated_at
      properties:
        agent_id:
          type: string
        created_at:
          type: string
        display_name:
          type: string
        enforcement_profile_id:
          type: string
        id:
          type: string
        provider_connection_id:
          type: string
        updated_at:
          type: string
    GatewayRouteListResponse:
      type: object
      required:
      - gateway_routes
