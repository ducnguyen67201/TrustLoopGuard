# TrustLoopGuard — local stack.
#
# `docker compose up` brings up:
#   - db     — Postgres 16 (data persisted in named volume `tl-data`)
#   - server — tl-server on :8080 (auto-runs migrations on boot)
#   - web    — Next.js dashboard on :3000
#
# Zero env vars required for first boot. `.env.example` documents the
# optional knobs. The DB credentials below are local-only. Postgres is
# published to localhost so host-based dev commands like `make server`
# and `make dev-db` use the same database as the Compose stack.
#
# Stop:        docker compose down
# Wipe data:   docker compose down -v
# Rebuild:     docker compose build
# Edit policies: edit ./policies/*.yaml then `docker compose restart server`
# (compose mounts ./policies on top of the baked image copy)

name: trustloopguard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustloop
      POSTGRES_PASSWORD: trustloop
      POSTGRES_DB: trustloop
    volumes:
      - tl-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustloop -d trustloop"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: crates/tl-server/Dockerfile
    environment:
      DATABASE_URL: postgres://trustloop:trustloop@db:5432/trustloop
      RUST_LOG: ${RUST_LOG:-info}
      TL_API_KEY: ${TL_API_KEY:-}
      TL_LLM_CONFIG: ${TL_LLM_CONFIG:-}
      TL_ESCALATION_WEBHOOK_URL: ${TL_ESCALATION_WEBHOOK_URL:-}
    volumes:
      # Override the baked policies bundle so `edit YAML + restart` is
      # the dev loop. Read-only on purpose — the server never writes here.
      - ./policies:/etc/trustloopguard/policies:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    # No HEALTHCHECK: the runtime is distroless (no shell, no wget/curl),
    # so an in-container probe isn't possible without bloating the image.
    # `web` uses depends_on: service_started below — Next retries failed
    # API calls anyway, and the user-facing impact of the ~1s startup
    # gap is invisible.
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Inlined into the page at runtime, NOT baked at build time.
      # Browsers hit this URL directly — `localhost:8080` works because
      # compose publishes the server port back to the host.
      NEXT_PUBLIC_TL_SERVER_URL: ${NEXT_PUBLIC_TL_SERVER_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-prod}
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-/apps/doc}
      TL_SERVER_URL: ${TL_SERVER_URL:-http://server:8080}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
    depends_on:
      server:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  tl-data:
