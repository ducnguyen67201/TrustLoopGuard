# Featherlane AI — local stack.
#
# `docker compose up` brings up:
#   - db     — Postgres 16 (data persisted in named volume `tl-data`)
#   - server — tl-server on :8080 (auto-runs migrations on boot)
#   - web    — Next.js dashboard on :3000
#
# Set `POSTGRES_PASSWORD` and `TL_API_KEY` before first boot (or copy
# `.env.example` to `.env` and replace the placeholders). Published ports
# are loopback-only so the local stack is never exposed to the LAN by default.
#
# Stop:        docker compose down
# Wipe data:   docker compose down -v
# Rebuild:     docker compose build
# Edit policies: edit ./policies/*.yaml then `docker compose restart server`
# (compose mounts ./policies on top of the baked image copy)

name: featherlane-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: featherlane_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
      POSTGRES_DB: featherlane_ai
    volumes:
      - tl-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featherlane_ai -d featherlane_ai"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: crates/tl-server/Dockerfile
    environment:
      DATABASE_URL: postgres://featherlane_ai:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}@db:5432/featherlane_ai
      RUST_LOG: ${RUST_LOG:-info}
      TL_API_KEY: ${TL_API_KEY:?Set TL_API_KEY before starting Compose}
      TL_SERVER_ADDR: 0.0.0.0:8080
      TL_PUBLIC_URL: ${TL_PUBLIC_URL:-http://localhost:8080}
      TL_DASHBOARD_URL: ${TL_DASHBOARD_URL:-http://localhost:3000}
      TL_GATEWAY_CREDENTIAL_KEY: ${TL_GATEWAY_CREDENTIAL_KEY:-featherlane-ai-local-gateway-credential-key}
      TL_ESCALATION_WEBHOOK_URL: ${TL_ESCALATION_WEBHOOK_URL:-}
      REDTEAM_RUNNER_URL: ${REDTEAM_RUNNER_URL:-}
      TL_GITHUB_APP_ID: ${TL_GITHUB_APP_ID:-}
      TL_GITHUB_APP_SLUG: ${TL_GITHUB_APP_SLUG:-}
      TL_GITHUB_CLIENT_ID: ${TL_GITHUB_CLIENT_ID:-}
      TL_GITHUB_CLIENT_SECRET: ${TL_GITHUB_CLIENT_SECRET:-}
      TL_GITHUB_PRIVATE_KEY_BASE64: ${TL_GITHUB_PRIVATE_KEY_BASE64:-}
      TL_GITHUB_WEBHOOK_SECRET: ${TL_GITHUB_WEBHOOK_SECRET:-}
    volumes:
      # Override the baked policies bundle so `edit YAML + restart` is
      # the dev loop. Read-only on purpose — the server never writes here.
      - ./policies:/etc/featherlane-ai/policies:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # No HEALTHCHECK: the runtime is distroless (no shell, no wget/curl),
    # so an in-container probe isn't possible without bloating the image.
    # `web` uses depends_on: service_started below — Next retries failed
    # API calls anyway, and the user-facing impact of the ~1s startup
    # gap is invisible.
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Inlined into the page at runtime, NOT baked at build time.
      # Browsers hit this URL directly — `localhost:8080` works because
      # compose publishes the server port back to the host.
      NEXT_PUBLIC_TL_SERVER_URL: ${NEXT_PUBLIC_TL_SERVER_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-/apps/doc}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      TL_SERVER_URL: http://server:8080
      TL_API_KEY: ${TL_API_KEY:?Set TL_API_KEY before starting Compose}
      AUTH_SECRET: ${AUTH_SECRET:-featherlane-ai-local-auth-secret-change-me}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
    depends_on:
      server:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  tl-data:
