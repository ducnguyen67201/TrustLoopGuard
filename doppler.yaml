# Project/config pointers for `doppler setup`. Safe to commit — contains
# no secrets and no tokens. Auth comes from each developer's local
# `doppler login` session.
#
# Usage (one-time per machine, after `doppler login` with GitHub):
#
#   doppler setup
#
# That single command walks this file and links the repo root,
# apps/web, and demo to featherlane-ai/dev. From then on,
# `pnpm dev`, `make server`, `make agent-demo`, etc. inject secrets
# automatically via `doppler run --`.
#
# To use a different config locally (e.g. dev_demo or dev_infras),
# override the link per directory after setup:
#
#   doppler setup --project featherlane-ai --config dev_demo --no-interactive
setup:
  - project: featherlane-ai
    config: dev
    path: ./
  - project: featherlane-ai
    config: dev
    path: apps/web
  - project: featherlane-ai
    config: dev
    path: demo
