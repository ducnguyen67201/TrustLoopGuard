[package]
name = "tl-server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TrustLoopGuard HTTP server (axum)"

[[bin]]
name = "tl-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# tl-core's `openapi` feature is enabled here so utoipa::path attribute
# macros on handlers can reference the schema'd types.
tl-core = { workspace = true, features = ["openapi"] }
tl-engine = { workspace = true }
tl-policy = { workspace = true }
tl-storage = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "4", features = ["axum_extras"] }
async-trait = { workspace = true }
serde_yaml = { workspace = true }
bytes = "1"

[dev-dependencies]
http-body-util = "0.1"
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
