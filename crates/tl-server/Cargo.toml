[package]
name = "tl-server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TrustLoopGuard HTTP server (axum)"

[[bin]]
name = "tl-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["postgres"]
# Enables Postgres-backed boot path: connects DATABASE_URL, runs
# migrations, spawns the trace writer, uses AgentRepo for profile
# resolution. Disable default features only for memory-only tests or
# demos that intentionally do not persist across restarts.
postgres = ["tl-storage/postgres"]

[dependencies]
# tl-core's `openapi` feature is enabled here so utoipa::path attribute
# macros on handlers can reference the schema'd types.
tl-core = { workspace = true, features = ["openapi"] }
tl-cache = { workspace = true }
tl-engine = { workspace = true }
tl-llm = { workspace = true }
tl-policy = { workspace = true }
tl-storage = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "4", features = ["axum_extras"] }
async-trait = { workspace = true }
serde_yaml = { workspace = true }
bytes = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { workspace = true }
chrono = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = "0.10"
url = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
