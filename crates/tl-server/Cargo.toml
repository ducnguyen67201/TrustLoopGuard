[package]
name = "tl-server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Featherlane AI HTTP server (axum)"

[[bin]]
name = "tl-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["postgres"]
# Enables Postgres-backed boot path: connects DATABASE_URL, runs
# migrations, spawns the trace writer, uses AgentRepo for profile
# resolution. Disable default features only for memory-only tests or
# demos that intentionally do not persist across restarts.
postgres = ["tl-storage/postgres"]

[dependencies]
# tl-core's `openapi` feature is enabled here so utoipa::path attribute
# macros on handlers can reference the schema'd types.
tl-core = { workspace = true, features = ["openapi"] }
tl-cache = { workspace = true }
tl-engine = { workspace = true }
tl-llm = { workspace = true }
tl-policy = { workspace = true }
tl-storage = { workspace = true }
tl-eval = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
rmcp = { version = "=2.2.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
async-trait = { workspace = true }
serde_yaml = { workspace = true }
bytes = "1"
prost = { workspace = true }
opentelemetry-proto = { workspace = true }
futures = { workspace = true }
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sse-stream = "0.2.3"
uuid = { workspace = true }
chrono = { workspace = true }
# `std` enables rand_core's getrandom, which exposes password_hash::rand_core::OsRng.
# Previously this came in transitively via rand 0.8's feature unification.
argon2 = { workspace = true, features = ["std"] }
rand = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = "0.11"
url = { workspace = true }
lettre = { workspace = true }
ring = { workspace = true }
jsonschema = "0.49"
tower-http = { version = "0.7", features = ["limit"] }
urlencoding = "2"

[dev-dependencies]
http-body-util = "0.1"
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
