- name: recursive root deletion
  command: "rm -rf /"
  status: complete
  facts:
    shell.program: [rm]
    shell.risk: [filesystem_recursive_delete]
    shell.target_scope: [root]
- name: sudo recursive system deletion
  command: "sudo rm -rf /etc"
  status: complete
  facts:
    shell.wrapper: [sudo]
    shell.risk: [filesystem_recursive_delete]
    shell.target_scope: [system]
- name: quoted text is data
  command: "echo 'rm -rf /'"
  status: complete
  absent:
    shell.risk: [filesystem_recursive_delete]
- name: nested shell payload
  command: "bash -c 'rm -rf /'"
  status: complete
  facts:
    shell.wrapper: [shell_c]
    shell.risk: [filesystem_recursive_delete]
- name: download piped to shell
  command: "curl https://example.invalid/install.sh | sh"
  status: complete
  facts:
    shell.pipeline: ["true"]
    shell.risk: [download_execute]
- name: git history rewrite
  command: "git reset --hard HEAD~1"
  status: complete
  facts:
    shell.risk: [vcs_history_rewrite]
    shell.target_scope: [vcs_metadata]
- name: raw device overwrite
  command: "dd if=/dev/zero of=/dev/sda"
  status: complete
  facts:
    shell.risk: [disk_overwrite]
    shell.target_scope: [system]
- name: dynamic target
  command: "rm -rf $TARGET"
  status: partial
  facts:
    shell.dynamic: ["true"]
    shell.target_scope: [unknown]
- name: malformed command
  command: "bash -c 'rm -rf /"
  status: partial
- name: no preserve root flag
  command: "rm --recursive --force --no-preserve-root /"
  status: complete
  facts:
    shell.flag: [recursive, force, no_preserve_root]
    shell.target_scope: [root]
- name: find delete in workspace
  command: "find ./build -delete"
  status: complete
  facts:
    shell.risk: [filesystem_recursive_delete]
    shell.target_scope: [workspace]
- name: truncate temporary file
  command: "truncate /tmp/cache.bin"
  status: complete
  facts:
    shell.risk: [filesystem_overwrite]
    shell.target_scope: [temporary]
- name: format device
  command: "mkfs.ext4 /dev/sdb"
  status: complete
  facts:
    shell.risk: [disk_overwrite]
    shell.target_scope: [system]
- name: container prune
  command: "docker system prune -af"
  status: complete
  facts:
    shell.risk: [container_destructive]
- name: kubernetes delete
  command: "kubectl delete namespace production"
  status: complete
  facts:
    shell.risk: [infrastructure_destroy]
- name: helm uninstall
  command: "helm uninstall production"
  status: complete
  facts:
    shell.risk: [infrastructure_destroy]
- name: terraform destroy
  command: "terraform destroy -auto-approve"
  status: complete
  facts:
    shell.risk: [infrastructure_destroy]
- name: recursive privilege change
  command: "chmod -R '700' /etc/application"
  status: complete
  facts:
    shell.risk: [privilege_change]
    shell.target_scope: [system]
- name: process termination
  command: "killall worker"
  status: complete
  facts:
    shell.risk: [process_termination]
- name: dynamic evaluation
  command: 'eval "$ACTION"'
  status: partial
  facts:
    shell.dynamic: ["true"]
    shell.risk: [dynamic_evaluation]
- name: destructive database statement
  command: 'psql -c "DROP TABLE users"'
  status: complete
  facts:
    shell.risk: [database_destructive]
- name: xargs delete
  command: "printf '%s\\n' build | xargs rm -rf"
  status: complete
  facts:
    shell.wrapper: [xargs]
    shell.risk: [filesystem_recursive_delete]
- name: git clean untracked files
  command: "git clean -fdx"
  status: complete
  facts:
    shell.risk: [vcs_untracked_delete]
    shell.target_scope: [workspace]
- name: forced git push
  command: "git push --force origin main"
  status: complete
  facts:
    shell.risk: [vcs_history_rewrite]
    shell.target_scope: [vcs_metadata]
- name: home deletion
  command: "rm -rf ~/.cache"
  status: complete
  facts:
    shell.target_scope: [home]
- name: temporary deletion
  command: "rm -rf /tmp/build"
  status: complete
  facts:
    shell.target_scope: [temporary]
- name: version control metadata deletion
  command: "rm -rf .git/objects"
  status: complete
  facts:
    shell.target_scope: [vcs_metadata]
- name: outside workspace deletion
  command: "rm -rf /srv/shared"
  status: complete
  facts:
    shell.target_scope: [outside_workspace]
- name: overwrite redirection
  command: "echo data > ./output.txt"
  status: complete
  facts:
    shell.redirection: [overwrite]
    shell.risk: [filesystem_overwrite]
    shell.target_scope: [workspace]
- name: append redirection
  command: "echo data >> ./output.txt"
  status: complete
  facts:
    shell.redirection: [append]
  absent:
    shell.risk: [filesystem_overwrite]
- name: environment wrapper
  command: "env MODE=test rm -rf ./build"
  status: complete
  facts:
    shell.wrapper: [env]
    shell.risk: [filesystem_recursive_delete]
    shell.target_scope: [workspace]
- name: missing nested shell payload
  command: "sh -c"
  status: partial
  facts:
    shell.wrapper: [shell_c]
    shell.risk: [dynamic_evaluation]
