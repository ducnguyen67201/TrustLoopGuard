[package]
name = "tl-storage"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Featherlane AI decision-log storage: in-memory + Postgres"

[features]
default = []
# Compiles the PostgresStore + Diesel migrations. Opt-in so the
# basic in-memory tests don't need to compile database dependencies.
postgres = [
  "dep:diesel",
  "dep:diesel-async",
  "dep:diesel_migrations",
  "dep:uuid",
  "dep:chrono",
  "dep:serde_json",
  "dep:moka",
  "dep:serde",
  "dep:serde_yaml",
  "dep:sha2",
  "dep:tl-policy",
  "dep:base64",
  "dep:rand",
]
# Runs the Postgres integration tests via testcontainers. Requires
# Docker locally; off in CI by default. Enable with:
#   cargo test -p tl-storage --features postgres-it
postgres-it = ["postgres", "dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
tl-core = { workspace = true }
tl-policy = { workspace = true, optional = true }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Optional — gated behind `postgres` feature.
serde = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
diesel-async = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
moka = { version = "0.12", features = ["future"], optional = true }
sha2 = { version = "0.11", optional = true }
base64 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

# Optional — gated behind `postgres-it` feature for integration tests.
testcontainers = { version = "0.27", optional = true }
testcontainers-modules = { version = "0.15", features = ["postgres"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
