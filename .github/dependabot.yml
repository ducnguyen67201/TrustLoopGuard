version: 2

updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1
    commit-message:
      prefix: 'deps(cargo)'
    groups:
      cargo-patch-minor:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/apps/docs'
      - '/apps/example-typescript'
      - '/apps/marketing'
      - '/apps/web'
      - '/demo'
      - '/sdks/typescript'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '08:30'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 3
    versioning-strategy: 'increase-if-necessary'
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1
    commit-message:
      prefix: 'deps(npm)'
      prefix-development: 'deps-dev(npm)'
    groups:
      npm-production-patch-minor:
        dependency-type: 'production'
        group-by: 'dependency-name'
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
      npm-development-patch-minor:
        dependency-type: 'development'
        group-by: 'dependency-name'
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Toronto'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 1
    commit-message:
      prefix: 'deps(actions)'
    groups:
      actions-patch-minor:
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
