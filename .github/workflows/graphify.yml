name: graphify

on:
  push:
    branches: [main]
  # PR triggers were dropped: regenerating the knowledge graph on every
  # PR push wasted CI time and surfaced false-failing auto-merge checks.
  # The graph is only useful for the canonical state of `main`, so we
  # rebuild + commit only when something lands there.
  workflow_dispatch:

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: install graphifyy
        run: |
          set -euo pipefail
          python -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux2014_x86_64 \
            --platform manylinux_2_17_x86_64 \
            --platform manylinux1_x86_64 \
            --python-version 3.11 \
            --implementation cp \
            --dest "$RUNNER_TEMP/graphify" \
            --requirement .github/graphify-requirements.txt
          (
            cd "$RUNNER_TEMP/graphify"
            sha256sum --check "$GITHUB_WORKSPACE/.github/graphify-wheels.sha256"
            expected="$(wc -l < "$GITHUB_WORKSPACE/.github/graphify-wheels.sha256")"
            downloaded="$(find . -maxdepth 1 -type f -name '*.whl' | wc -l)"
            test "$downloaded" -eq "$expected"
          )
          python -m venv "$RUNNER_TEMP/graphify-venv"
          "$RUNNER_TEMP/graphify-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --find-links "$RUNNER_TEMP/graphify" \
            --requirement .github/graphify-requirements.txt

      - name: build graph (AST-only, no LLM)
        # --force: this job rebuilds deterministically from source with no LLM
        # chunk files to lose, so a legitimate node-count drop (code removed in a
        # PR) must not trip graphify's missing-chunks guard and fail CI.
        run: "$RUNNER_TEMP/graphify-venv/bin/graphify" update . --force

      - name: upload graph artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14

  commit-graph-to-main:
    name: commit graph to main
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graphify-out
          path: graphify-out/

      - name: commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          if git diff --cached --quiet; then
            echo "no graph changes to commit"
            exit 0
          fi
          git commit -m "chore(graphify): regenerate knowledge graph [skip ci]"
          git push origin HEAD:main
