name: graphify

on:
  push:
    branches: [main]
  # PR triggers were dropped: regenerating the knowledge graph on every
  # PR push wasted CI time and surfaced false-failing auto-merge checks.
  # The graph is only useful for the canonical state of `main`, so we
  # rebuild + commit only when something lands there.
  workflow_dispatch:

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install graphifyy
        run: pipx install graphifyy

      - name: build graph (AST-only, no LLM)
        run: graphify update .

      - name: upload graph artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error
          retention-days: 14

  commit-graph-to-main:
    name: commit graph to main
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: graphify-out
          path: graphify-out/

      - name: commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          if git diff --cached --quiet; then
            echo "no graph changes to commit"
            exit 0
          fi
          git commit -m "chore(graphify): regenerate knowledge graph [skip ci]"
          git push origin HEAD:main

