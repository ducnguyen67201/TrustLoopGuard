name: Publish SDK

on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    name: Bump, build, and publish
    runs-on: ubuntu-latest
    environment: sdk-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#sdk-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Set package version from tag
        run: |
          cd sdks/typescript
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @trustloopguard/sdk typecheck

      - name: Build
        run: pnpm --filter @trustloopguard/sdk build

      - name: Test
        run: pnpm --filter @trustloopguard/sdk test

      - name: Publish to npm
        run: pnpm --filter @trustloopguard/sdk publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
