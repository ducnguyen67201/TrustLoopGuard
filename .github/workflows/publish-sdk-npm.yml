name: Publish SDK

on:
  push:
    tags:
      - 'sdk-v*'

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sdk-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Extract and validate version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#sdk-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SDK version tag suffix: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Verify package version matches tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./sdks/typescript/package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          RELEASE_COMMIT="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @featherlane-ai/sdk typecheck

      - name: Build
        run: pnpm --filter @featherlane-ai/sdk build

      - name: Test
        run: pnpm --filter @featherlane-ai/sdk test

      - name: Verify packed npm artifact
        run: pnpm --filter @featherlane-ai/sdk test:package

      - name: Publish to npm
        working-directory: sdks/typescript
        run: npm publish --access public
