name: boundary lint

# Mechanical enforcement of docs/SDK_DRIVEN.md rule 2: demos may import
# only the published SDK surface, never internal crates. This is a fast
# lint (no compilation, no install) — it scans source files with grep
# and exits non-zero on the first violation, proving the demos didn't
# cheat by reaching past the SDK boundary.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-boundaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundaries:
    name: SDK imports and API contracts stay on public boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Run lint
        run: make ci-lint
