name: docker publish

# Build + push tl-server and tl-web images to GHCR.
#
# Triggers:
#   - push to main          → tags `latest` and `sha-<short>`
#   - git tag v*            → tags `vX.Y.Z` (and major/minor)
#   - workflow_dispatch     → manual rebuild
#
# Output:
#   ghcr.io/<owner>/tl-server:<tag>
#   ghcr.io/<owner>/tl-web:<tag>
#
# Multi-arch (linux/amd64 + linux/arm64) so Apple Silicon contributors
# and AWS Graviton nodes get native binaries instead of qemu-emulated
# ones.
#
# After the FIRST successful run, the package owner must visit
#   https://github.com/<owner>/<repo>/pkgs/container/<name>
# and flip "Package visibility" to public so anonymous `docker pull`
# works without `docker login ghcr.io`.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tl-server
            dockerfile: crates/tl-server/Dockerfile
          - image: tl-web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR namespace is the repo owner, lowercased.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Image digest
        run: echo "Pushed ${{ matrix.image }} @ ${{ steps.meta.outputs.tags }}"
