name: quickstart

# Runs the README's quickstart literally on a clean Ubuntu runner.
# Per docs/SDK_DRIVEN.md rule 3: if a stranger copy-pasting the README
# can't get a Decision back, the README is wrong — and that's a release
# blocker, not a docs ticket. This workflow makes that gate mechanical.
#
# The job mirrors `make quickstart`: spawn tl-server, run all three
# example apps against it, tear it down. Pinned tool versions keep the
# baseline stable so a quickstart break is caused by *us*, not by a
# random tooling drift on GitHub's runner.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quickstart:
    name: README quickstart end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache from rust-ci.yml so this job's profile of
          # built crates (server + sdk + example-rust) doesn't fight
          # the test-runner cache.
          key: quickstart

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Python tooling
        # The SDK's editable install needs `build`-style deps; the
        # codegen path needs datamodel-code-generator (the quickstart
        # script doesn't run codegen but tl-server compilation may
        # depend on it transitively in CI matrices).
        run: |
          python -m pip install --upgrade pip
          pip install datamodel-code-generator

      - name: Install pnpm workspace deps
        run: pnpm install --frozen-lockfile

      - name: Run quickstart
        # `make quickstart` shells into scripts/quickstart.sh which
        # builds + boots tl-server, polls /health, and runs every
        # example app. A non-zero exit fails the job and dumps the
        # server log via the script's own error path.
        run: make quickstart

      - name: Surface server log on failure
        if: failure()
        run: |
          echo "::group::tl-server log"
          cat /tmp/tl-server.log || echo "(no log captured)"
          echo "::endgroup::"
