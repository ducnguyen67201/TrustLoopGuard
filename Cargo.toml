[workspace]
resolver = "2"
members = [
    "crates/tl-core",
    "crates/tl-policy",
    "crates/tl-engine",
    "crates/tl-cache",
    "crates/tl-fuzzy",
    "crates/tl-llm",
    "crates/tl-stream",
    "crates/tl-server",
    "crates/tl-sdk-rust",
    "crates/tl-storage",
    "crates/tl-replay",
    "crates/tl-cli",
    "crates/tl-codegen",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/ducnguyen67201/TrustLoopGuard"
authors = ["TrustLoopGuard contributors"]

[workspace.dependencies]
tl-core = { path = "crates/tl-core" }
tl-policy = { path = "crates/tl-policy" }
tl-engine = { path = "crates/tl-engine" }
tl-cache = { path = "crates/tl-cache" }
tl-fuzzy = { path = "crates/tl-fuzzy" }
tl-llm = { path = "crates/tl-llm" }
tl-stream = { path = "crates/tl-stream" }
tl-storage = { path = "crates/tl-storage" }
tl-replay = { path = "crates/tl-replay" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
futures = "0.3"
async-trait = "0.1"

# Web server. default-features = false keeps the server crate small and lets
# us opt into only the http1 + json + tokio surface we actually use.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "macros"] }
tower = { version = "0.5", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Errors
anyhow = "1"
thiserror = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Matching
regex = "1"
aho-corasick = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
diesel = { version = "2.3.8", default-features = false, features = ["postgres", "uuid", "chrono", "serde_json"] }
diesel-async = { version = "0.9", default-features = false, features = ["postgres", "bb8"] }
diesel_migrations = { version = "2.3", default-features = false, features = ["postgres"] }
url = "2"

# Auth
argon2 = "0.5"
rand = "0.10"
base64 = "0.22"
jsonwebtoken = { version = "9", default-features = false }
ring = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# A guardrail server should fail fast on bug-class panics, not unwind through
# half-poisoned state. Also smaller binary, faster compile.
panic = "abort"
debug = false
incremental = false

[profile.dev]
opt-level = 0
debug = true

# Inherit release optimization for benchmarks but keep symbols so flamegraphs
# show real function names.
[profile.bench]
inherits = "release"
debug = true
