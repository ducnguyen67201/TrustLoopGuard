[package]
name = "example-rust"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Smallest possible TrustLoopGuard integration. Imports only tl-sdk-rust."

# This crate enforces rule 2 of docs/SDK_DRIVEN.md: example apps import
# only the published SDK surface — no internal crates. The
# `lint-no-internal-imports` workflow (PR 11) makes that mechanical.

[[bin]]
name = "example-rust"
path = "src/main.rs"

[dependencies]
tl-sdk-rust = { path = "../../crates/tl-sdk-rust" }
# tl-core is intentionally NOT a dependency. The Rust SDK re-exports the
# types an integrator needs (CheckRequest, Decision, Verdict, …); reaching
# into tl-core directly would mean the SDK surface is incomplete.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
