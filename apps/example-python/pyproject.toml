[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

# Standalone example app. Depends only on the published Python SDK —
# this matches what a stranger gets after `pip install trustloopguard`.
# See docs/SDK_DRIVEN.md rule 2 (no internal imports in apps/).

[project]
name = "trustloopguard-example"
version = "0.0.1"
description = "Smallest TrustLoopGuard integration in Python."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # In a production install this is `trustloopguard >= 0.0.1`. We use
    # a path dep here so `pip install -e apps/example-python` picks up
    # the in-tree SDK during local dev / CI.
    "trustloopguard",
]

[project.scripts]
trustloopguard-example = "main:main"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

[tool.hatch.build.targets.sdist]
only-include = ["main.py", "README.md"]
