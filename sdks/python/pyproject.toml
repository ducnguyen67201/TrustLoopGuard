[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "featherlane-ai"
version = "0.0.1"
description = "Featherlane AI Python SDK. Real-time guardrails for AI agents."
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Featherlane AI contributors" }]
keywords = ["ai", "agents", "guardrails", "safety"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
ag2 = [
    "ag2>=1.0.0b0,<1.1",
]
agno = [
    "agno>=2.8.3,<3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "datamodel-code-generator>=0.25",
    "respx>=0.21",
    "ag2>=1.0.0b0,<1.1",
    "agno>=2.8.3,<3",
]

[project.urls]
Homepage = "https://featherlane.ai"
Repository = "https://github.com/ducnguyen67201/FeatherlaneAI"

[tool.hatch.build.targets.wheel]
packages = ["src/featherlane_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
