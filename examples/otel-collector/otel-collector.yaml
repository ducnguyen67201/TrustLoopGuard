receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "tool.arguments")
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlphttp/featherlane:
    endpoint: ${env:FEATHERLANE_OTLP_ENDPOINT}
    headers:
      Authorization: Bearer ${env:FEATHERLANE_API_KEY}
      x-featherlane-environment: ${env:FEATHERLANE_ENVIRONMENT_ID}
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 60s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [otlphttp/featherlane]
