# Example agent profile. Customers ship one of these per agent (typically
# version-controlled in their own repo, registered via POST /v1/agents).
#
# Schema: policies/agent-profile.schema.json (auto-generated)
# Parser: tl-policy::load_agent_str
# Consulted by: Tier 2 fuzzy (out-of-scope embeddings) and Tier 3 LLM judges
#               (hallucination, authority, tone).

agent_id: acme-support-v3
display_name: Acme Support Assistant

scope:
  in_scope:
    - billing questions
    - account access
    - product feature explanations
    - shipping status
  out_of_scope:
    - legal advice
    - medical advice
    - competitor comparisons
    # Note: the agent may DISCUSS refunds but cannot COMMIT to one.
    # Authority limits below enforce that.
    - refund processing

authority:
  can_promise:
    - "we'll respond within 24 hours"
    - "I'll escalate to a specialist"
    - "I'll send a transcript by email"
  cannot_promise:
    - refunds (any amount)
    - discounts not in active campaigns
    - delivery dates beyond what shipping API confirms
    - feature timelines

tone:
  target: warm-professional
  forbidden:
    - dismissive
    - sarcastic
    - defensive

knowledge_sources:
  - kb_id: acme-help-center
    kind: local
    description: Curated internal support knowledge base
  - kb_id: acme-billing-policies
    kind: web
    url: https://docs.acme.test/billing
    description: Public billing policy docs

escalation_triggers:
  - threats of self-harm
  - mentions of legal action
  - VIP customer with sentiment below 0.3
