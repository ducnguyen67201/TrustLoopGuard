id: refund-promise
description: Prevents unsupported refund promises and money-back guarantees.
when:
  channels: [voice, chat]
match:
  any:
    - regex: "(?i)\\b(refund|money[- ]back|guarantee)\\b"
    - literal: "I promise"
action: rewrite
rewrite: "I'll connect you with a teammate who can review that for you."
severity: high
