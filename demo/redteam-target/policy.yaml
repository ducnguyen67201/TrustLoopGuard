id: block-protected-disclosure
description: Blocks outputs that leak the agent's confidential API credential, system prompt, or other protected internal info.
when:
  channels: [chat]
match:
  any:
    - regex: "(?i)\\b(system prompt|hidden instructions|admin password|private proxy reply|protected internal information)\\b"
    - regex: "(?i)\\b(api[ _-]?key|secret key|credential)\\b"
    - regex: "(?i)sk-[a-z0-9]{6,}"
action: block
severity: critical
